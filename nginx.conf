# Конфиг nginx для страницы управления. Монтируется как default.conf,
# поэтому никаких переменных здесь не подставляется.

# Прокси принимает адрес матрицы из пути, поэтому ограничиваем его приватными сетями:
# иначе контейнер станет открытым прокси в любую точку сети.
map $device_ip $device_allowed {
    "~^10\."                          1;
    "~^192\.168\."                    1;
    "~^172\.(1[6-9]|2[0-9]|3[01])\."  1;
    default                         0;
}

# Порт TCP: 1–65535. Без этой проверки в пути можно было бы указать любой порт хоста.
map $device_port $device_port_ok {
    "~^[1-9][0-9]{0,3}$"  1;
    "~^[1-5][0-9]{4}$"    1;
    "~^6[0-4][0-9]{3}$"   1;
    "~^65[0-4][0-9]{2}$"  1;
    "~^655[0-2][0-9]$"    1;
    "~^6553[0-5]$"        1;
    default             0;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Вход на страницу управления. Пароль задаётся переменными UI_USER / UI_PASSWORD.
    auth_basic "HDMI Matrix";
    auth_basic_user_file /etc/nginx/.htpasswd;

    add_header X-Content-Type-Options nosniff always;

    # /device/<ip>/<путь> → матрица по <ip>. Адрес может быть любой из добавленных матриц.
    # Регулярка в кавычках: в ней есть фигурные скобки, без кавычек nginx принял бы их за блок.
    # /device/<ip>[:<port>]/<путь>. Порт по умолчанию 80.
    location ~ "^/device/(\d{1,3}(?:\.\d{1,3}){3})(?::(\d{1,5}))?(/.*)$" {
        set $device_ip $1;
        set $device_port $2;
        set $device_path $3;
        if ($device_port = "") {
            set $device_port 80;
        }
        if ($device_allowed = 0) {
            return 403;
        }
        if ($device_port_ok = 0) {
            return 400;
        }
        proxy_pass http://$device_ip:$device_port$device_path$is_args$args;
        # Пустой адрес в сети должен отвечать ошибкой быстро: поиск по сети опрашивает много адресов.
        proxy_connect_timeout 1s;
        proxy_read_timeout 5s;
        # Матрица часто обрывает соединение после команды записи. Повтор такого
        # запроса переключил бы выход второй раз, поэтому повторов не делаем.
        proxy_next_upstream off;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
