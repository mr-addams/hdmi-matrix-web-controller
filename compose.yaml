# Страница управления HDMI-матрицами: один контейнер из опубликованного образа.
# Версию образа задаёт HDMI_UI_VERSION в .env; обычно её выставляет install.sh.
services:
  matrix-ui:
    image: ghcr.io/mr-addams/hdmi-matrix-web-controller:${HDMI_UI_VERSION:-latest}
    ports:
      # По умолчанию только loopback: у матриц нет аутентификации.
      - "${MATRIX_UI_BIND:-127.0.0.1}:${MATRIX_UI_PORT:-8080}:8080"
    environment:
      UI_USER: ${UI_USER:-admin}
      UI_PASSWORD: ${UI_PASSWORD:-admin}
    volumes:
      # Подписи и теги входов и выходов. Named volume: переживает обновление образа.
      - matrix-data:/data
    restart: unless-stopped
    # Ограничиваем контейнер: никаких дополнительных привилегий, корень read-only, запись только в /data.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  matrix-data:
