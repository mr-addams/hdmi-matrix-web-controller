# Страница управления HDMI-матрицами: один контейнер, без установки чего-либо ещё на хост.
#
# Запуск:  cp .env.example .env   # поменяй UI_PASSWORD
#          docker compose up -d --build
services:
  matrix-ui:
    build: .
    ports:
      # По умолчанию только loopback: у матриц нет аутентификации.
      - "${MATRIX_UI_BIND:-127.0.0.1}:${MATRIX_UI_PORT:-8080}:8080"
    environment:
      UI_USER: ${UI_USER:-admin}
      UI_PASSWORD: ${UI_PASSWORD:-admin}
    volumes:
      # Подписи и теги входов и выходов. Named volume: переживает пересборку образа.
      - matrix-data:/data
    restart: unless-stopped
    # Ограничиваем контейнер: никаких дополнительных привилегий, корень read-only, запись только в /data.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  matrix-data:
