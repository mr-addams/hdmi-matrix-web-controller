# Build from source for development: docker compose -f compose.dev.yaml up -d --build
# Otherwise identical to compose.yaml, but the image is built locally from the Dockerfile.
services:
  matrix-ui:
    build: .
    image: hdmi-matrix-web-controller:dev
    ports:
      - "${MATRIX_UI_BIND:-127.0.0.1}:${MATRIX_UI_PORT:-8080}:8080"
    environment:
      UI_USER: ${UI_USER:-admin}
      UI_PASSWORD: ${UI_PASSWORD:-admin}
    volumes:
      - matrix-data:/data
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  matrix-data:
